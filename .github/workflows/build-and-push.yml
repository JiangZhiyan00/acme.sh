name: Build and Push acme.sh+docker-cli Image

# ─────────────────────────────────────────────
# 触发条件
# ─────────────────────────────────────────────
on:
  schedule:
    # 每周三 UTC 02:00（北京时间 10:00）自动运行
    - cron: "0 2 * * 3"
  # 允许在 Actions 页面手动触发（调试或强制更新时使用）
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "强制重新构建，忽略 digest 比对"
        required: false
        default: false
        type: boolean

# ─────────────────────────────────────────────
# 全局环境变量
# ─────────────────────────────────────────────
env:
  # 上游官方镜像
  UPSTREAM_IMAGE: neilpang/acme.sh:latest
  # 你的目标镜像（从 Secrets 读取用户名）
  TARGET_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/acme.sh
  # 缓存文件路径
  DIGEST_CACHE_FILE: .upstream-digest

jobs:
  # ───────────────────────────────────────────
  # Job 1: 检查是否需要更新
  # ───────────────────────────────────────────
  check-update:
    name: 检查官方镜像是否有更新
    runs-on: ubuntu-latest
    outputs:
      needs_build: ${{ steps.compare.outputs.needs_build }}
      upstream_digest: ${{ steps.get_upstream.outputs.digest }}

    steps:
      - name: 获取上游官方镜像的 digest
        id: get_upstream
        run: |
          # 从全局 env 变量解析上游仓库名和标签（如 neilpang/acme.sh:latest）
          UPSTREAM_REPO="${UPSTREAM_IMAGE%:*}"   # neilpang/acme.sh
          UPSTREAM_TAG="${UPSTREAM_IMAGE##*:}"    # latest

          # 通过 Docker Hub API 获取官方镜像 manifest digest（无需登录）
          TOKEN=$(curl -s \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${UPSTREAM_REPO}:pull" \
            | jq -r '.token')

          DIGEST=$(curl -s \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            -I "https://registry-1.docker.io/v2/${UPSTREAM_REPO}/manifests/${UPSTREAM_TAG}" \
            | grep -i "docker-content-digest" \
            | awk '{print $2}' \
            | tr -d '\r')

          echo "上游镜像 digest: ${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: 恢复上次记录的 digest 缓存
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.DIGEST_CACHE_FILE }}
          # 前缀匹配，自动匹配最近一次保存的缓存
          key: upstream-digest-${{ github.run_id }}
          restore-keys: upstream-digest-

      - name: 读取缓存中的 digest
        id: get_current
        run: |
          if [ -f "${DIGEST_CACHE_FILE}" ]; then
            RECORDED=$(cat "${DIGEST_CACHE_FILE}")
            echo "上次记录的上游 digest: ${RECORDED}"
            echo "digest=${RECORDED}" >> "$GITHUB_OUTPUT"
          else
            echo "未找到缓存，视为首次构建"
            echo "digest=none" >> "$GITHUB_OUTPUT"
          fi

      - name: 对比 digest，决定是否构建
        id: compare
        run: |
          UPSTREAM="${{ steps.get_upstream.outputs.digest }}"
          CURRENT="${{ steps.get_current.outputs.digest }}"
          FORCE="${{ github.event.inputs.force_rebuild }}"

          echo "上游 digest : ${UPSTREAM}"
          echo "当前 digest : ${CURRENT}"
          echo "强制重建   : ${FORCE}"

          if [ "${FORCE}" = "true" ]; then
            echo "手动触发强制重建"
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          elif [ "${UPSTREAM}" != "${CURRENT}" ]; then
            echo "官方镜像已更新，需要重新构建"
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "官方镜像未更新，跳过构建"
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
          fi

  # ───────────────────────────────────────────
  # Job 2: 构建并推送镜像
  # ───────────────────────────────────────────
  build-and-push:
    name: 构建并推送到 Docker Hub
    runs-on: ubuntu-latest
    needs: check-update
    # 仅在需要更新时才执行此 Job
    if: needs.check-update.outputs.needs_build == 'true'

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 登录 Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 提取元数据（标签、注释）
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.TARGET_IMAGE }}
          tags: |
            # 始终更新 latest 标签
            type=raw,value=latest
            # 同时打上日期标签，方便回滚
            type=raw,value={{date 'YYYY-MM-DD'}}
          labels: |
            maintainer=${{ github.repository_owner }}
            org.opencontainers.image.title=acme.sh with Docker CLI
            org.opencontainers.image.description=${{ env.UPSTREAM_IMAGE }} with docker-cli pre-installed
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 启用 GitHub Actions 缓存加速构建
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 将新 digest 写入缓存文件
        run: |
          echo "${{ needs.check-update.outputs.upstream_digest }}" > ${{ env.DIGEST_CACHE_FILE }}

      - name: 保存 digest 缓存
        uses: actions/cache/save@v6
        with:
          path: ${{ env.DIGEST_CACHE_FILE }}
          # 使用 run_id 作为唯一 key，restore-keys 前缀匹配保证下次能找到
          key: upstream-digest-${{ github.run_id }}

      - name: 输出构建摘要
        run: |
          echo "### 构建成功 ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 项目 | 值 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 目标镜像 | \`${{ env.TARGET_IMAGE }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 上游 digest | \`${{ needs.check-update.outputs.upstream_digest }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 构建时间 | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 平台 | linux/amd64 |" >> "$GITHUB_STEP_SUMMARY"
